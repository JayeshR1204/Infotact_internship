name: Enterprise HRMS CI Pipeline

on:
  push:
    branches: [main, 'feature/*', 'fix/*']
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Backend TypeScript Build & Type Check
  # ──────────────────────────────────────────────────────────────
  backend-ci:
    name: "Backend — TypeScript Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: TypeScript Type-Check (Zero Errors Gate)
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────────────────────
  # Job 2: Frontend TypeScript Build & Vite Compile
  # ──────────────────────────────────────────────────────────────
  frontend-ci:
    name: "Frontend — Vite Build Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npx tsc --noEmit

      - name: Vite Production Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # Job 3: PR Guard — Only allow merging if both jobs pass
  # ──────────────────────────────────────────────────────────────
  ci-gate:
    name: "CI Gate — All Checks Passed"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()
    steps:
      - name: Evaluate CI Result
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "❌ CI FAILED: One or more checks did not pass."
            exit 1
          fi
          echo "✅ All CI checks passed. Safe to merge."
