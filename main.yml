name: Enterprise HRMS CI Pipeline

# Trigger the workflow on every push or pull request to your tracking branch
on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code onto the GitHub runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Node.js environment matching modern 2026 standards
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-node: '20.x'
        cache: 'npm'
        cache-dependency-path: './server/package-lock.json'

    # Step 3: Install all backend dependencies securely
    - name: Install Server Dependencies
      run: |
        cd server
        npm ci

    # Step 4: Compile TypeScript code to verify zero build errors
    - name: Compile TypeScript (Build Check)
      run: |
        cd server
        npx tsc --noEmit
